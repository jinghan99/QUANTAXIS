name: mongodb
services:
  common-mongodb:
    image: mongo:7.0.45
    container_name: common-mongodb
    restart: unless-stopped
    ports:
      - "192.168.1.35:27017:27017"
    environment:
      TZ: Asia/Shanghai
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?required}
    command: ["mongod", "--auth", "--bind_ip_all"]
    volumes:
      - ./data:/data/db
      - ./configdb:/data/configdb
      - ./init-user.js:/docker-entrypoint-initdb.d/10-user.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "const a = db.getSiblingDB('admin'); if (!a.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1); if (a.runCommand({ping:1}).ok !== 1) quit(1);"
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
